name: Run Python Script Hourly

on:
  schedule:
    - cron: "57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  MPLBACKEND: "Agg" # Fast, headless rendering for Matplotlib (today.png / tomorrow.png)

jobs:
  run-script:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true # Caches package wheels only, not weather data

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run prediction script
        run: python -O predict_html.py --include-dssc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
