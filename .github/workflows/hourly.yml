name: Run Python Script Hourly

on:
  schedule:
    - cron: "57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write     # Required for Pages deployment
  id-token: write  # Required for OIDC authentication

# Prevent concurrent deployments from queueing/hanging
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-script:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        shell: bash
        run: |
          set -euo pipefail
          python predict_html.py --include-dssc

      - name: Organize build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          mv index.html today.png tomorrow.png dayaftertomorrow.png public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'  # Point directly to the folder containing the web assets

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
