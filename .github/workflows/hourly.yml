name: Run Python Script Hourly

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: davosersee-wind-predictor
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workflow context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"
          echo "UTC time:"
          date -u

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction script
        shell: bash
        run: |
          set -euo pipefail
          python predict_html.py --include-dssc

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f index.html ] && git add index.html

          shopt -s nullglob
          pngs=( *.png )
          if [ ${#pngs[@]} -gt 0 ]; then
            git add "${pngs[@]}"
          fi

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Automated hourly HTML update"

          # Rebase in case new commits landed while this workflow ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push
